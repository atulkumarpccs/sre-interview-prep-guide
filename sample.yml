# ============================================================
# Pipeline: Agent Pool Parallel Distribution Test
# Purpose : Validate that Azure DevOps auto-picks idle agents
#           from the pool - NO Load Balancer needed
# ============================================================

trigger: none  # Manual trigger only for testing

pool:
  name: 'YOUR-PRIVATE-AGENT-POOL-NAME'  # 🔁 Replace with your pool name

# -----------------------------------------------------------
# This creates 5 parallel jobs simultaneously
# Each job will be picked by a different idle agent in pool
# -----------------------------------------------------------
strategy:
  parallel: 5  # Change this number based on agents you have

jobs:

# -----------------------------------------------------------
# JOB 1
# -----------------------------------------------------------
- job: AgentTest_Job1
  displayName: '🔵 Job 1 - Agent Distribution Test'
  pool:
    name: 'YOUR-PRIVATE-AGENT-POOL-NAME'  # 🔁 Replace
  steps:
    - script: |
        echo "============================================"
        echo "JOB 1 PICKED BY AGENT: $(Agent.Name)"
        echo "Machine Name       : $(Agent.MachineName)"
        echo "Agent ID           : $(Agent.Id)"
        echo "Pool Name          : $(Agent.PoolName)"
        echo "Job Start Time     : $(date)"
        echo "============================================"
        echo "Simulating workload - sleeping 60 seconds..."
        sleep 60
        echo "Job 1 Complete on Agent: $(Agent.Name)"
      displayName: 'Print Agent Info & Simulate Load'

